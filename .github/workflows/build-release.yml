name: Build and Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        working-directory: ./frontend/app
        run: |
          npm install
          npm run build
          if (Test-Path ..\..\backend\frontend_dist) { Remove-Item ..\..\backend\frontend_dist -Recurse -Force }
          New-Item -ItemType Directory -Force -Path ..\..\backend\frontend_dist
          Copy-Item -Path dist\* -Destination ..\..\backend\frontend_dist -Recurse -Force

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Backend (PyInstaller)
        working-directory: ./backend
        run: |
          pyinstaller --noconfirm --clean AutoUploader.spec

      - name: Install Inno Setup
        run: |
          choco install innosetup

      - name: Compile Installer (Inno Setup)
        working-directory: ./build
        run: |
          iscc installer.iss

      - name: Cleanup Old Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete-asset latest RaynzPitStop_Setup.exe -y || true

      - name: Read Version Info
        id: ver
        shell: pwsh
        run: |
          $json = Get-Content version.json | ConvertFrom-Json
          echo "version=$($json.version)" >> $env:GITHUB_OUTPUT
          echo "build=$($json.build)" >> $env:GITHUB_OUTPUT

      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Ryanz Pitstop v${{ steps.ver.outputs.version }} (Build ${{ steps.ver.outputs.build }})
          body: "Ryanz Pitstop v${{ steps.ver.outputs.version }} (Build ${{ steps.ver.outputs.build }})"
          files: release/RaynzPitStop_Setup.exe
          make_latest: true

  build-macos:
    needs: build-windows
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        working-directory: ./frontend/app
        run: |
          npm install
          npm run build
          rm -rf ../../backend/frontend_dist
          mkdir -p ../../backend/frontend_dist
          cp -R dist/* ../../backend/frontend_dist/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Backend (PyInstaller macOS Bundle)
        working-directory: ./backend
        run: |
          pyinstaller --noconfirm --windowed --name "RaynzPitStop" \
            --add-data "frontend_dist:frontend_dist" \
            --add-data "services/license/keys:services/license/keys" \
            --add-data "prompts:prompts" \
            --add-data "../version.json:." \
            main.py

      - name: Package DMG
        working-directory: ./backend
        run: |
          hdiutil create -volname "RaynzPitStop" -srcfolder dist/RaynzPitStop.app -ov -format UDZO RaynzPitStop.dmg

      - name: Read Version Info
        id: ver
        shell: bash
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('version.json'))['version'])")
          BUILD=$(python3 -c "import json; print(json.load(open('version.json'))['build'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT

      - name: Update Release with macOS DMG
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Ryanz Pitstop v${{ steps.ver.outputs.version }} (Build ${{ steps.ver.outputs.build }})
          body: "Ryanz Pitstop v${{ steps.ver.outputs.version }} (Build ${{ steps.ver.outputs.build }})"
          files: backend/RaynzPitStop.dmg
          make_latest: true
